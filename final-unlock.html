<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPARK | Final Unlock</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080808;color:#f7f4eb;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;overflow-x:hidden}.wrap{width:min(760px,100%);text-align:center}.eyebrow{letter-spacing:5px;font-size:12px;opacity:.55;margin-bottom:12px}.title{font-size:clamp(42px,10vw,82px);margin:0;font-weight:900;letter-spacing:-3px}.sub{opacity:.65;margin:12px auto 34px;max-width:560px;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;text-align:left}.field{border:1px solid #292929;background:#101010;padding:16px}.field label{display:block;font-size:11px;letter-spacing:2px;opacity:.5;margin-bottom:9px}.field input{width:100%;background:#070707;border:1px solid #303030;color:#fff;padding:14px;font:700 18px monospace;letter-spacing:2px;text-transform:uppercase;outline:none}.field input:focus{border-color:#fff}.btn{margin-top:18px;width:100%;padding:17px;border:0;background:#f7f4eb;color:#080808;font-weight:900;letter-spacing:2px;cursor:pointer}.status{min-height:50px;margin-top:18px;padding:14px;border:1px solid #252525;display:flex;align-items:center;justify-content:center;line-height:1.5}.success{border-color:#78e08f}.error{border-color:#ff5f56;color:#ff8a84}.final{display:none;margin-top:28px;padding:30px;border:1px solid #78e08f;background:rgba(120,224,143,.04)}.final h2{margin:0 0 10px;font-size:30px}.qr{width:min(320px,80vw);background:#fff;padding:18px;margin:20px auto}.qr img{display:block;width:100%;height:auto}.small{font-size:11px;opacity:.45;letter-spacing:1px}@media(max-width:600px){.grid{grid-template-columns:1fr}.title{letter-spacing:-2px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">SPARK COMMUNITY · FINAL CHALLENGE</div>
  <h1 class="title">FINAL UNLOCK</h1>
  <p class="sub">Eight tracks. Eight unique tokens. One final reveal. Enter the tokens collected by your team.</p>
  <div class="grid" id="tokenGrid">
    <div class="field"><label>01 · DATA ANALYSIS</label><input maxlength="20" autocomplete="off" data-track="data-analysis" placeholder="XXXXXX-XXXXXX-XXXXXX"></div>
    <div class="field"><label>02 · WEB DEVELOPMENT</label><input maxlength="20" autocomplete="off" data-track="web-development" placeholder="XXXXXX-XXXXXX-XXXXXX"></div>
    <div class="field"><label>03 · BIOINFORMATICS</label><input maxlength="20" autocomplete="off" data-track="bioinformatics" placeholder="XXXXXX-XXXXXX-XXXXXX"></div>
    <div class="field"><label>04 · CYBER SECURITY</label><input maxlength="20" autocomplete="off" data-track="cyber-security" placeholder="XXXXXX-XXXXXX-XXXXXX"></div>
    <div class="field"><label>05 · LOGISTICS</label><input maxlength="20" autocomplete="off" data-track="logistics" placeholder="XXXXXX-XXXXXX-XXXXXX"></div>
    <div class="field"><label>06 · HUMAN RESOURCES</label><input maxlength="20" autocomplete="off" data-track="human-resources" placeholder="XXXXXX-XXXXXX-XXXXXX"></div>
    <div class="field"><label>07 · MARKETING</label><input maxlength="20" autocomplete="off" data-track="marketing" placeholder="XXXXXX-XXXXXX-XXXXXX"></div>
    <div class="field"><label>08 · GENERAL SKILLS</label><input maxlength="20" autocomplete="off" data-track="general-skills" placeholder="XXXXXX-XXXXXX-XXXXXX"></div>
  </div>
  <button class="btn" id="verify">VERIFY TEAM →</button>
  <div class="status" id="status">WAITING FOR 8 TOKENS</div>
  <section class="final" id="final">
    <h2>🔓 FINAL UNLOCKED</h2>
    <p>SPARK IS IGNITED. Scan the QR below to continue.</p>
    <div class="qr"><img id="finalQr" alt="Final QR"></div>
    <div class="small">FINAL REVEAL</div>
  </section>
</div>
<script>
const SUPABASE_URL="https://kyiyxkprrqdgosmhabjv.supabase.co";
const SUPABASE_KEY="sb_publishable_hMnZrZlncivkcZFgO7nlwA_QOnAwlVJ";
const FINAL_URL="https://mazenelshebly.github.io/spark-community/final-reveal.html";
const statusEl=document.getElementById('status');
const inputs=[...document.querySelectorAll('input')];
inputs.forEach(i=>i.addEventListener('input',()=>{i.value=i.value.toUpperCase().replace(/[^A-Z0-9-]/g,'')}));
function setStatus(msg,ok=false){statusEl.textContent=msg;statusEl.className='status '+(ok?'success':'error')}
document.getElementById('verify').addEventListener('click',async()=>{
 const tokens=inputs.map(i=>i.value.trim()).filter(Boolean);
 if(tokens.length!==8){setStatus('ENTER ALL 6 TOKENS.');return;}
 if(new Set(tokens).size!==6){setStatus('EACH TOKEN MUST BE UNIQUE.');return;}
 const btn=document.getElementById('verify');btn.disabled=true;btn.textContent='VERIFYING…';setStatus('CHECKING THE TEAM…',true);
 try{
  const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/verify_final_tokens`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`},body:JSON.stringify({p_tokens:tokens})});
  const d=await r.json();
  if(!r.ok) throw new Error(d?.message||d?.error||'Verification failed');
  const result=Array.isArray(d)?d[0]:d;
  if(!result?.success) throw new Error(result?.message||'Tokens are not valid.');
  document.getElementById('final').style.display='block';
  document.getElementById('finalQr').src=`https://api.qrserver.com/v1/create-qr-code/?size=700x700&margin=20&data=${encodeURIComponent(FINAL_URL)}`;
  setStatus('8 / 8 TRACKS VERIFIED — FINAL UNLOCKED.',true);
  btn.style.display='none';
  inputs.forEach(i=>i.disabled=true);
 }catch(e){setStatus('❌ '+e.message);btn.disabled=false;btn.textContent='VERIFY TEAM →';}
});
</script>
</body>
</html>
