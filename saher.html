<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Love Rain</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050505;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

canvas {
  display: block;
  width: 100vw;
  height: 56.25vw;
  max-width: 177.78vh;
  max-height: 100vh;
  background: #050505;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = 1280;
let H = 720;

let DPR =
  Math.min(
    window.devicePixelRatio || 1,
    2
  );


function resize() {

  const aspect = 16 / 9;

  let width =
    window.innerWidth;

  let height =
    window.innerHeight;

  if (width / height > aspect) {

    width =
      height * aspect;

  } else {

    height =
      width / aspect;
  }

  W =
    Math.floor(
      width * DPR
    );

  H =
    Math.floor(
      height * DPR
    );

  canvas.width = W;
  canvas.height = H;

  createRain();
}

window.addEventListener(
  "resize",
  resize
);


/* =========================================================
   TIMING
========================================================= */

const INTRO_TIME = 5000;

const FORMATION_TIME = 3500;

/*
   ثبات كل كلمة = ثانيتين بالظبط
*/
const HOLD_TIME = 2000;

/*
   القلب يتكون بنفس سرعة الكلمات
*/
const HEART_FORMATION_TIME =
  FORMATION_TIME;


/* =========================================================
   RAIN
========================================================= */

const RAIN_TEXT =
  "Iloveyou";

let rain = [];


function createRain() {

  rain = [];

  const fontSize =
    Math.max(
      18,
      Math.min(
        27,
        W / 52
      )
    );

  const columnGap =
    fontSize * 0.82;

  const columnCount =
    Math.ceil(
      W / columnGap
    ) + 6;


  for (
    let i = 0;
    i < columnCount;
    i++
  ) {

    rain.push({

      x:
        i * columnGap,

      y:
        -(i % 40) *
        fontSize *
        0.84 -
        fontSize * 3,

      speed:
        330 +
        Math.random() * 80,

      size:
        fontSize
    });
  }
}


function updateRain(dt) {

  for (
    const column of rain
  ) {

    column.y +=
      column.speed * dt;

    if (
      column.y >
      H + 500
    ) {

      column.y = -500;
    }
  }
}


function drawRain() {

  if (!rain.length) {
    return;
  }

  ctx.save();

  const fontSize =
    rain[0].size;

  ctx.font =
    "700 " +
    fontSize +
    "px Arial";

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";


  const spacing =
    fontSize * 0.84;

  const patternHeight =
    RAIN_TEXT.length *
    spacing;


  for (
    const column of rain
  ) {

    let offset =
      column.y %
      patternHeight;

    if (offset < 0) {
      offset +=
        patternHeight;
    }

    const start =
      offset -
      patternHeight;

    const repetitions =
      Math.ceil(
        H / patternHeight
      ) + 3;


    for (
      let r = 0;
      r < repetitions;
      r++
    ) {

      for (
        let j = 0;
        j < RAIN_TEXT.length;
        j++
      ) {

        const y =
          start +
          r * patternHeight +
          j * spacing;

        if (
          y < -fontSize ||
          y > H + fontSize
        ) {
          continue;
        }

        ctx.fillStyle =
          "#ff3f9f";

        ctx.fillText(
          RAIN_TEXT[j],
          column.x,
          y
        );
      }
    }
  }

  ctx.restore();
}


/* =========================================================
   PARTICLES
========================================================= */

const PARTICLE_COUNT =
  2400;

let particles = [];


function createParticles() {

  particles = [];

  for (
    let i = 0;
    i < PARTICLE_COUNT;
    i++
  ) {

    particles.push({

      x:
        W *
        (i / PARTICLE_COUNT),

      y:
        H +
        30 +
        (i % 20) * 8,

      tx:
        W / 2,

      ty:
        H / 2,

      size:
        1.15 +
        Math.random() * 1.55,

      speed:
        0.065 +
        Math.random() * 0.035
    });
  }
}


/* =========================================================
   TEXT POINTS
========================================================= */

function getTextPoints(text) {

  const off =
    document.createElement(
      "canvas"
    );

  const octx =
    off.getContext(
      "2d"
    );

  off.width = W;
  off.height = H;


  let fontSize;


  if (text === "MY") {

    fontSize =
      Math.min(
        W * 0.22,
        H * 0.42
      );

  } else {

    fontSize =
      Math.min(
        W * 0.17,
        H * 0.34
      );
  }


  octx.clearRect(
    0,
    0,
    W,
    H
  );

  octx.fillStyle =
    "#ffffff";

  octx.textAlign =
    "center";

  octx.textBaseline =
    "middle";

  octx.font =
    "900 " +
    fontSize +
    "px Arial Black, Arial";


  octx.fillText(
    text,
    W / 2,
    H / 2
  );


  const image =
    octx.getImageData(
      0,
      0,
      W,
      H
    ).data;


  const rawPoints = [];

  const step = 5;


  for (
    let y = 0;
    y < H;
    y += step
  ) {

    for (
      let x = 0;
      x < W;
      x += step
    ) {

      const index =
        (y * W + x) *
        4 +
        3;


      if (
        image[index] > 100
      ) {

        rawPoints.push({
          x,
          y
        });
      }
    }
  }


  return rawPoints;
}


/* =========================================================
   DISTRIBUTE POINTS
========================================================= */

function distributePoints(
  points
) {

  const result = [];

  if (!points.length) {
    return result;
  }


  if (
    points.length >=
    PARTICLE_COUNT
  ) {

    for (
      let i = 0;
      i < PARTICLE_COUNT;
      i++
    ) {

      const index =
        Math.floor(
          i *
          points.length /
          PARTICLE_COUNT
        );

      result.push(
        points[index]
      );
    }

  } else {

    for (
      let i = 0;
      i < PARTICLE_COUNT;
      i++
    ) {

      result.push(
        points[
          i % points.length
        ]
      );
    }
  }


  return result;
}


/* =========================================================
   FULL WHITE HEART
========================================================= */

function getHeartPoints() {

  const heartCanvas =
    document.createElement(
      "canvas"
    );

  heartCanvas.width = W;
  heartCanvas.height = H;


  const hctx =
    heartCanvas.getContext(
      "2d"
    );


  const scale =
    Math.min(W, H) *
    0.024;


  const cx =
    W / 2;

  const cy =
    H / 2 + 5;


  hctx.clearRect(
    0,
    0,
    W,
    H
  );

  hctx.beginPath();


  const samples = 1200;


  for (
    let i = 0;
    i <= samples;
    i++
  ) {

    const t =
      (Math.PI * 2 * i) /
      samples;


    const x =
      16 *
      Math.pow(
        Math.sin(t),
        3
      );


    const y =
      13 *
      Math.cos(t)
      -
      5 *
      Math.cos(2 * t)
      -
      2 *
      Math.cos(3 * t)
      -
      Math.cos(4 * t);


    const px =
      cx +
      x * scale;


    const py =
      cy -
      y * scale;


    if (i === 0) {

      hctx.moveTo(
        px,
        py
      );

    } else {

      hctx.lineTo(
        px,
        py
      );
    }
  }


  hctx.closePath();

  hctx.fillStyle =
    "#ffffff";

  hctx.fill();


  const data =
    hctx.getImageData(
      0,
      0,
      W,
      H
    ).data;


  const raw = [];

  const step = 4;


  for (
    let y = 0;
    y < H;
    y += step
  ) {

    for (
      let x = 0;
      x < W;
      x += step
    ) {

      const index =
        (y * W + x) *
        4 +
        3;


      if (
        data[index] > 100
      ) {

        raw.push({
          x,
          y
        });
      }
    }
  }


  const result = [];


  for (
    let i = 0;
    i < PARTICLE_COUNT;
    i++
  ) {

    const index =
      Math.floor(
        i *
        raw.length /
        PARTICLE_COUNT
      );


    result.push(
      raw[index]
    );
  }


  return result;
}


/* =========================================================
   SET PARTICLE TARGETS
========================================================= */

function setParticleTargets(
  points
) {

  const targets =
    distributePoints(
      points
    );


  for (
    let i = 0;
    i < particles.length;
    i++
  ) {

    particles[i].tx =
      targets[i].x;

    particles[i].ty =
      targets[i].y;
  }
}


/* =========================================================
   PARTICLE UPDATE
========================================================= */

function updateParticles() {

  for (
    const p of particles
  ) {

    p.x +=
      (p.tx - p.x) *
      p.speed;

    p.y +=
      (p.ty - p.y) *
      p.speed;
  }
}


/* =========================================================
   PARTICLE DRAW
========================================================= */

function drawParticles() {

  ctx.save();

  ctx.fillStyle =
    "#ffffff";


  for (
    const p of particles
  ) {

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI * 2
    );

    ctx.fill();
  }


  ctx.restore();
}


/* =========================================================
   FINAL NEON MESSAGE
========================================================= */

function drawFinalMessage() {

  ctx.save();

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";


  /*
     ==========================================
     BIG FINAL TEXT
     ==========================================
  */

  const NEON =
    "#FFD166";

  const BRIGHT =
    "#FFF4C2";


  /*
     الجملة كبيرة جداً
  */

  let size =
    Math.min(
      W * 0.105,
      H * 0.19
    );


  const text =
    "I love you Sama❤️";


  /*
     خط كبير وأنيق
  */

  ctx.font =
    "italic 900 " +
    size +
    "px Georgia, " +
    "'Times New Roman', serif";


  /*
     تفضل بالكامل داخل القلب
  */

  const maxWidth =
    Math.min(
      W * 0.48,
      H * 0.48
    );


  while (
    ctx.measureText(text).width >
      maxWidth &&
    size > 18
  ) {

    size -= 1;

    ctx.font =
      "italic 900 " +
      size +
      "px Georgia, " +
      "'Times New Roman', serif";
  }


  const x =
    W / 2;


  const y =
    H / 2 + 10;


  /*
     ==========================================
     DARK OUTLINE
     عشان الكلام يبان فوق الـ particles
     ==========================================
  */

  ctx.lineWidth =
    size * 0.12;

  ctx.strokeStyle =
    "rgba(25, 12, 0, 0.95)";

  ctx.shadowColor =
    "#FFD166";

  ctx.shadowBlur =
    size * 0.35;

  ctx.strokeText(
    text,
    x,
    y
  );


  /*
     ==========================================
     HUGE GOLD NEON
     ==========================================
  */

  ctx.shadowColor =
    "#FFD000";

  ctx.shadowBlur =
    size * 0.75;

  ctx.fillStyle =
    NEON;

  ctx.fillText(
    text,
    x,
    y
  );


  /*
     ==========================================
     SECOND STRONG GLOW
     ==========================================
  */

  ctx.shadowColor =
    "#FFF000";

  ctx.shadowBlur =
    size * 0.40;

  ctx.fillStyle =
    "#FFD83D";

  ctx.fillText(
    text,
    x,
    y
  );


  /*
     ==========================================
     BRIGHT INNER CORE
     ==========================================
  */

  ctx.shadowColor =
    "#FFFFFF";

  ctx.shadowBlur =
    size * 0.14;

  ctx.fillStyle =
    BRIGHT;

  ctx.fillText(
    text,
    x,
    y
  );


  /*
     ==========================================
     WHITE HOT CENTER
     ==========================================
  */

  ctx.shadowBlur =
    size * 0.05;

  ctx.fillStyle =
    "#FFFFFF";

  ctx.globalAlpha =
    0.9;

  ctx.fillText(
    text,
    x,
    y
  );


  ctx.restore();
}


/* =========================================================
   STAGES
========================================================= */

let stage = 0;

let stageStartedAt =
  performance.now();

let finalMessage =
  false;

let previousTime =
  performance.now();


const words = [
  "YOU",
  "ARE",
  "MY",
  "LOVE"
];


/* =========================================================
   START WORD
========================================================= */

function startWord(
  index
) {

  const points =
    getTextPoints(
      words[index]
    );


  setParticleTargets(
    points
  );


  stageStartedAt =
    performance.now();
}


/* =========================================================
   START HEART
========================================================= */

function startHeart() {

  stage = 5;

  finalMessage =
    false;


  stageStartedAt =
    performance.now();


  const heartPoints =
    getHeartPoints();


  for (
    let i = 0;
    i < particles.length;
    i++
  ) {

    particles[i].tx =
      heartPoints[i].x;

    particles[i].ty =
      heartPoints[i].y;
  }
}


/* =========================================================
   STAGE LOGIC
========================================================= */

function updateStage(
  now
) {

  const elapsed =
    now -
    stageStartedAt;


  /*
     INTRO
  */

  if (
    stage === 0
  ) {

    if (
      elapsed >=
      INTRO_TIME
    ) {

      stage = 1;

      startWord(0);
    }

    return;
  }


  /*
     WORDS
  */

  if (
    stage >= 1 &&
    stage <= 4
  ) {

    /*
       3.5 ثانية تكوين
       + 2 ثانية ثبات
    */

    if (
      elapsed >=
      FORMATION_TIME +
      HOLD_TIME
    ) {

      if (
        stage < 4
      ) {

        stage++;

        startWord(
          stage - 1
        );

      } else {

        /*
           بعد LOVE مباشرة
           يبدأ القلب
        */

        startHeart();
      }
    }

    return;
  }


  /*
     HEART
  */

  if (
    stage === 5
  ) {

    /*
       بمجرد اكتمال مدة تكوين القلب
       تظهر الجملة فوراً
    */

    if (
      elapsed >=
      HEART_FORMATION_TIME
    ) {

      finalMessage =
        true;
    }
  }
}


/* =========================================================
   MAIN LOOP
========================================================= */

function animate(
  now
) {

  const dt =
    Math.min(
      (
        now -
        previousTime
      ) / 1000,
      0.05
    );


  previousTime =
    now;


  /*
     BACKGROUND
  */

  ctx.fillStyle =
    "#050505";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /*
     RAIN ALWAYS ON
  */

  updateRain(dt);

  drawRain();


  /*
     PARTICLES
  */

  if (
    stage >= 1
  ) {

    updateParticles();

    drawParticles();
  }


  /*
     FINAL MESSAGE
  */

  if (
    finalMessage
  ) {

    drawFinalMessage();
  }


  updateStage(now);


  requestAnimationFrame(
    animate
  );
}


/* =========================================================
   START
========================================================= */

resize();

createParticles();

requestAnimationFrame(
  animate
);

</script>

</body>
  </html>
